[package]
name = "clac-lang"
version = "0.6.0-alpha"
edition = "2024"
exclude = [
    "samples/",
]
license = "GPL-3.0-or-later"
description = "Reference implementation of Clac++, a simple stack-based postfix (reverse polish notation) calculator/programming language."

[[bin]]
name = "clac"

[dependencies]
ahash = "0.8.12"
clap = { version = "4.6.0", features = ["derive"] }
cranelift = "0.131.1"
cranelift-jit = "0.131.1"
cranelift-module = "0.131.1"
cranelift-native = "0.131.1"
cranelift-object = "0.131.1"
memmap2 = "0.9.10"
petgraph = "0.8.3"
rayon = "1.12.0"
rustyline = "18.0.0"
sc = "0.2.7"
thiserror = "2.0.18"
z3 = "0.20.0"

[features]
debug = []
resolve-basic-blocks = []
